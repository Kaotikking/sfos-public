# Target-neutral trixie preseed. Disk selection and destructive confirmation stay interactive.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string unassigned-host
d-i netcfg/get_hostname seen false
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i clock-setup/utc boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string ca-certificates debian-archive-keyring gpgv python3 systemd
d-i partman-auto/disk seen false
d-i partman/confirm seen false
d-i partman/confirm_nooverwrite seen false
d-i preseed/late_command string /bin/sh /cdrom/sfos/base/installer/late-install.sh /target /cdrom OFFLINE_USB_MEDIA /cdrom/sfos/source-road-receipt.json /cdrom/sfos/immutable-input-plan.json
